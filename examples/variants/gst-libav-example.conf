# gst-libav over a CrossOver runner. CrossOver's GStreamer cannot decode WMV/VC-1 or WMA
# Pro, so Media Foundation fails on games that play them (Resident Evil Village's intro
# video crashes the game). tools/install-gst-libav.sh assembles src from any x86_64
# gst-libav build, such as Whisky's, and writes a descriptor like this one:
#
#   tools/install-gst-libav.sh ~/Library/Application\ Support/com.isaacmarovitz.Whisky/Libraries/Wine/lib
#
# Besides the plugin, src carries a newer GLib, which the plugin needs, and a copy of the
# runner's libgstplayback with decodebin's 8 MB queues raised: ASF files that hold seconds
# of video before their first audio deadlock at 8 MB. That copy is why "build" is pinned.
[gst-libav-26.3.0.39832]
label   = gst-libav
variant = GStreamer
src     = .local/share/notproton/variants/gst-libav-26.3.0.39832
dst     = lib64
build   = 26.3.0.39832
